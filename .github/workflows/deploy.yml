# Builds the images a push changed and leaves them as artifacts of this run. Nothing is published
# and nothing here reaches a machine: when the run ends, GitHub's webhook tells the node, and the
# node fetches and checks what was built. See spec/architecture/host.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build, space-separated; empty for every one"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # cargo, for `deployable` to ask what each image's crate compiles once Cargo.lock moved: the
      # workspace's compiler at its minimal profile, no target added, since `cargo tree --target`
      # needs none installed, and the registry it reads, kept between runs. Without them it keeps
      # the lockfile's answer, which is wider. See .mise/tasks/resolved.py.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
          path: .workspace
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' .workspace/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ASKED: ${{ inputs.apps }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$ASKED" ]; then
            apps="$(printf '%s\n' $ASKED | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')"
          elif [ "$EVENT" = workflow_dispatch ] || [ -z "${BEFORE//0/}" ]; then
            apps="$(.mise/tasks/deployable --all)"
          else
            apps="$(.mise/tasks/deployable --git "$BEFORE")"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "building: $apps"

  # Every declaration the run builds an image for, apart and small, so a node reads where an app
  # is placed, and in which architecture, before it downloads any image. See infra's
  # spec/architecture/host.md, "The machine pulls; nothing pushes into it".
  declare:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - env:
          APPS: ${{ needs.plan.outputs.apps }}
        run: |
          mkdir -p "$RUNNER_TEMP/declarations"
          for app in $(printf '%s' "$APPS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            cp apps/*/"$app"/service.toml "$RUNNER_TEMP/declarations/$app.toml"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: declarations
          path: ${{ runner.temp }}/declarations/
          retention-days: 7
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
        arch: [arm64, amd64]
        # Each arch builds natively on its own runner; the include entries only attach the runner.
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      # The workspace above the project, as it is checked out at home: its rust-toolchain.toml is
      # the compiler every image is built with.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/infra
      # The runner's default builder cannot export an image as an archive; a container builder can.
      - uses: docker/setup-buildx-action@v4
      # The runtime's cache credentials, for sccache, which only an action is handed; see
      # spec/architecture/host.md, "An image is built for speed, and for any node of its
      # architecture".
      - uses: crazy-max/ghaction-github-runtime@v4
      - env:
          APP: ${{ matrix.app }}
          PLATFORM: linux/${{ matrix.arch }}
          SCCACHE_GHA_ENABLED: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          repos/infra/.mise/tasks/image "$APP" "$RUNNER_TEMP/deploy/image.tar"
          cp repos/infra/apps/*/"$APP"/service.toml "$RUNNER_TEMP/deploy/"
      # The image layers are compressed already; the node needs it for as long as a deploy takes.
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/deploy/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
