# The egress proxy, spec/architecture/nodes.md, "The nodes". `mise run node` fills in @IDENTITY@.
# No Listen: it binds every address, and the node's firewall already drops all but the tailnet,
# Docker's bridges and the loopback, where binding the tailnet address alone would fail at boot.
Port 8888
Timeout 600
MaxClients 20
LogLevel Info
Allow 100.64.0.0/10
Allow 127.0.0.1
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
@IDENTITY@
