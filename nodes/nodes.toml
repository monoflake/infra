# Every node, and what a person decides about it; the axes are spec/architecture/nodes.md.
# `domain` is the failure domain as a provider's code, `-2` for a second account at one provider:
# platform's spec/architecture/gateway.md, "Providers are short codes, registered here". `system`
# is the family the node's setup is written for. `lan` names an interface trusted like the tailnet,
# for the node in the house. `ipv4 = false`: no IPv4, so GitHub is reached through the others'
# egress proxies. `core` marks the three that hold the control plane, `canary = true` the one a new
# host, keeper or Caddy reaches first. `emulate = ["arm64"]` runs arm64 images on x86 Debian.
# `grants` adds `app:role` pairs; `tunnel_protocol` (quic, http2, auto) and `tunnel_ip_version`
# (auto, 4, 6) set the tunnel's. Appended, never inserted: a node's position is its weekly slot.

[tyo]
core = true
tier = "datacenter"
domain = "oci"
expiry = 2036
system = "debian"

[nrt]
canary = true
tier = "datacenter"
domain = "oci"
expiry = 2036
system = "alpine"

[hnd]
tier = "datacenter"
domain = "oci"
expiry = 2036
system = "alpine"

[gvx]
tier = "datacenter"
domain = "az"
expiry = 2030
system = "debian"
ipv4 = false
grants = ["database:peer", "quorum:peer"]

[bru]
tier = "datacenter"
domain = "az"
expiry = 2030
system = "debian"
ipv4 = false

[buf]
core = true
tier = "datacenter"
domain = "rkn"
expiry = 2027
system = "debian"
emulate = ["arm64"]

[rdu]
core = true
tier = "home"
domain = "int"
system = "debian"
lan = "end0"

[sha]
tier = "home"
domain = "int"
system = "debian"
emulate = ["arm64"]
grants = ["database:peer", "quorum:peer"]
tunnel_ip_version = 6
