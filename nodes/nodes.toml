# Every node, and what a person decides about it; the axes are spec/architecture/nodes.md.
# `system` is the family the node's setup is written for. `lan` names an interface whose network is
# trusted like the tailnet, for the one node in the house.

[tyo]
tier = "datacenter"
domain = "oci"
expiry = 2036
system = "debian"

