[env]
# Credentials, decrypted by mise on entering the directory. The file is committed encrypted; only
# the age private key opens it -- see the workspace's spec/toolchain.md, "Secrets".
_.file = "secrets.json"

# oxfmt lives in package.json rather than [tools]: its svelte option resolves `svelte/compiler`
# through node's module graph, which a mise-installed binary can never reach. This keeps what pnpm
# carries invocable from the shell and from `jj fix`.
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.test]
description = "Run every test in the workspace"
run = "pnpm exec vitest run"

[tasks.check]
description = "Type check every package, in each runtime context"
# Two programs, because the browser and bare node declare different things under the same names;
# each tsconfig says which is which.
run = ["pnpm exec tsc -p tsconfig.json --noEmit", "pnpm exec tsc -p tsconfig.scripts.json --noEmit"]

[tasks.lint]
description = "Lint the workspace"
# The expansion is strict mode, set by `mise run audit` and nothing else. See spec/lint-format.md.
run = 'oxlint . ${AUDIT:+--deny-warnings}'

[tasks.test-rust]
description = "Run the Rust test suites"
run = 'cargo test ${RUST_PACKAGES:---workspace}'

[tasks.lint-rust]
description = "Lint the Rust crates"
# `-D warnings` on the command line outranks the lint table in Cargo.toml, which is how strict
# mode reaches `complexity = "warn"` without that table being edited. See spec/lint-format.md.
# RUST_PACKAGES is `verify` naming the crates a change reached; run alone, it is every crate.
run = 'cargo clippy ${RUST_PACKAGES:---workspace} --all-targets ${AUDIT:+-- -D warnings}'

[tasks.check-panel]
description = "Type check the panel, host's interface, a SvelteKit application of its own"
dir = "apps/panel"
run = 'pnpm run check ${AUDIT:+--fail-on-warnings}'

[tasks.host]
description = "Build an app for the machine at home: `host deploy <name>` hands it to host there"
# Leaves this machine and stays there, like every other deploy. See spec/architecture/host.md.
run = "node apps/host/scripts/host.ts"

[tasks.infra]
description = "Read the node over host's API: `infra <what> [app] [path]`, before reaching for SSH"
# Read-only, so unlike `host` above it never writes off this machine. See
# spec/architecture/inspect.md, "`mise run infra`".
run = "node apps/host/scripts/infra.ts"

[tasks.reach]
description = "Answer on localhost for an interface only the LAN reaches: `reach [name]`, the panel by default"
run = "node apps/host/scripts/reach.ts"

# The workspace's verbs reach these three; what each owes is in the workspace's repos spec, "What a
# repository's task owes the verb". `clean` is a file task, .mise/tasks/clean.
[tasks.fmt]
description = "Format the Rust and the TypeScript, Svelte, JSON and prose, with jj.toml's formatters: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List the files that would change and write nothing"'
run = '''
files='**/*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,css,json,jsonc,md,svelte}'
if [ -n "${usage_dry_run:-}" ]; then
	cargo fmt --all --check --message-format short || true
	oxfmt --list-different --no-error-on-unmatched-pattern "$files" || true
else
	cargo fmt --all
	oxfmt --no-error-on-unmatched-pattern "$files"
fi
'''

[tasks.update]
description = "Move the crates, the packages and this repository's own tools within their ranges, and name what waits beyond: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Cross the ranges Cargo.toml and package.json declare"
'''
run = '''
n=${usage_dry_run:+--dry-run}
major=${usage_major:-}
own=$(sed -n '/^\[tools\]/,/^\[/{/^[a-z0-9-]* *=/s/ *=.*//p;}' mise.toml)
echo "\$ mise upgrade $own${n:+ --dry-run}"
mise upgrade $own $n
echo
if [ -n "$major" ]; then
	if command -v cargo-upgrade >/dev/null; then cargo upgrade --incompatible $n
	else echo "cargo-edit is not installed: the crates' majors were not checked"; fi
fi
cargo update $n
echo
if [ -n "$n" ]; then
	.mise/tasks/outdated
	exit 0
fi
# Across the ranges, only what the report calls behind: a package versions.toml allows at two majors
# is left on both. See web's spec/toolchain.md, "A package at two majors is a warning unless it is
# allowed".
names=$([ -z "$major" ] || .mise/tasks/outdated --names | tr '\n' ' ')
echo "\$ pnpm update -r${major:+ --latest $names}"
if [ -n "$major" ] && [ -z "$names" ]; then echo "nothing waits beyond its range"; exit 0; fi
if ! out=$(pnpm update -r ${major:+--latest $names} 2>&1); then
	echo "$out"
	echo "$out" | grep -q ERR_PNPM_NO_MATURE_MATCHING_VERSION || exit 1
	echo "held by the supply-chain delay, nothing moved in the pnpm half; run again once it has aged"
else
	echo "$out"
fi
'''
