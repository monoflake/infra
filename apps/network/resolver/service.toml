# The house's DNS, one of the platform's own: every name passed down a chain that skips what fails,
# none answered with the node. See spec/architecture/host.md, "The resolver serves the house, and
# answers nothing of its own".
version = 1
name = "resolver"
placements = ["rdu"]

[container]
# Its health, which the rendered Corefile serves; DNS itself is the shape's to publish.
port = 15353
health = "/health"
memory_mb = 64
