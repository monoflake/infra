# host as keeper deploys it. Its shape is the platform's and not this file's to choose, and its
# own names are rendered by host itself; see spec/architecture/host.md.
version = 1
name = "host"
display_name = "Host"
placements = ["rdu", "tyo", "nrt", "hnd", "gvx", "bru", "buf"]

[container]
# After the machine's address ending in .11.
port = 11011
health = "/health"
# About 40 MiB; images are streamed from disk, so a deploy adds buffers rather than an image.
memory_mb = 128
